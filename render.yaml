services:
  - type: web
    name: medicine-ecommerce-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false       # You will set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false       # You will set this manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false       # You will set this manually in Render dashboard
      - key: STRIPE_SECRET_KEY
        sync: false       # You will set this manually in Render dashboard
      - key: CLIENT_URL
        sync: false       # Set to your Vercel frontend URL e.g. https://your-app.vercel.app
